services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Sem porta publicada: a API é acessada pelo proxy do front em :8080/api (menos risco de conflito de porta).
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONT_PORT:-8080}:80"
